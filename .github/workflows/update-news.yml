name: 부동산 뉴스 업데이트

on:
  schedule:
    # 한국 시간 07:00, 18:00 (GitHub는 UTC 기준이라 9시간을 뺀 값)
    # GitHub 사정에 따라 몇 분~수십 분 늦게 실행될 수 있다
    - cron: "0 22 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # Actions 화면에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 수집·요약
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/collect.py

      - name: 결과 저장
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "뉴스 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
