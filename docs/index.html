<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="부동산뉴스">
<title>경기·인천 부동산 뉴스</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body { font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#f4f6fb; color:#222;
  display:flex; flex-direction:column; overflow:hidden; }

/* 헤더 */
.hd { background:linear-gradient(135deg,#1a3a5c 0%,#0d6efd 100%); color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px; flex-shrink:0; }
.hd h1 { font-size:18px; font-weight:800; letter-spacing:-.4px; }
.hd .meta { font-size:11.5px; opacity:.8; margin-top:3px; }
.hd-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.rsw { display:flex; background:rgba(255,255,255,.18); border-radius:18px; padding:3px; flex-shrink:0; }
.rsw a { color:#fff; text-decoration:none; font-size:12.5px; font-weight:700; padding:5px 11px; border-radius:15px; white-space:nowrap; opacity:.85; }
.rsw a.on { background:#fff; color:#1a3a5c; opacity:1; }
.src { font-size:11px; color:#8a94a6; }

/* 필터 (가로 스크롤) */
.filters { background:#fff; border-bottom:1px solid #e8edf5; padding:9px 12px; display:flex; gap:7px;
  overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
.filters::-webkit-scrollbar { display:none; }
.tag { border:1.5px solid #dde3ee; border-radius:18px; padding:6px 13px; font-size:13px; white-space:nowrap;
  background:#fff; color:#555; font-weight:600; cursor:pointer; font-family:inherit; }
.tag.on { color:#fff; border-color:transparent; background:var(--c,#0d6efd); }
.tag .n { font-size:11px; opacity:.75; margin-left:3px; }

/* 본문 */
main { flex:1; min-height:0; position:relative; }
.pane { position:absolute; inset:0; }
#listPane { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0 90px; }
#mapPane { visibility:hidden; }
#map { position:absolute; inset:0; }
body.show-map #listPane { visibility:hidden; }
body.show-map #mapPane { visibility:visible; }

/* 카드 */
.day { font-size:12px; font-weight:700; color:#7a869a; padding:12px 18px 2px; }
.card { background:#fff; margin:8px 12px; border-radius:12px; padding:14px 15px; border:1.5px solid #e8edf5; }
.card.sel { border-color:#0d6efd; box-shadow:0 4px 16px rgba(13,110,253,.15); }
.top { display:flex; align-items:center; gap:6px; margin-bottom:7px; flex-wrap:wrap; }
.cat { font-size:11px; font-weight:700; color:#fff; border-radius:6px; padding:2px 8px; }
.rgn { font-size:11px; color:#445; background:#f0f4ff; border-radius:6px; padding:2px 8px; font-weight:600;
  border:none; font-family:inherit; cursor:pointer; }
.rgn.nomap { cursor:default; }
.tm { font-size:11px; color:#aab; margin-left:auto; }
.ttl { font-size:15px; font-weight:700; color:#1a2a3a; line-height:1.5; margin-bottom:8px; }
.sum { font-size:13px; color:#4a5260; line-height:1.7; }
.sum div { display:flex; gap:7px; }
.sum b { color:#0d6efd; flex-shrink:0; }
.lnk { display:inline-block; margin-top:9px; font-size:12.5px; color:#0d6efd; text-decoration:none; font-weight:600; }

.empty { padding:60px 24px; text-align:center; color:#99a; font-size:14px; line-height:1.8; }
.empty .ico { font-size:44px; margin-bottom:10px; }

/* 하단 탭 */
.tabs { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:1000; display:flex; background:#1a2a3a; border-radius:26px; padding:4px; box-shadow:0 6px 20px rgba(0,0,0,.25); }
.tabs button { border:none; background:transparent; color:#cdd6e4; font-size:14px; font-weight:700;
  padding:9px 20px; border-radius:22px; font-family:inherit; cursor:pointer; white-space:nowrap; }
.tabs button.on { background:#fff; color:#1a2a3a; }

/* 지도 범례·팝업 */
.legend { position:absolute; top:10px; right:10px; z-index:900; background:rgba(255,255,255,.95);
  border-radius:10px; padding:8px 11px; box-shadow:0 2px 10px rgba(0,0,0,.12); font-size:11.5px; color:#444; }
.legend div { display:flex; align-items:center; gap:6px; margin:2px 0; }
.legend i { width:9px; height:9px; border-radius:50%; display:inline-block; }
.kdot { width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4); cursor:pointer; }
.kdot.area { width:14px; height:14px; border-width:2px; opacity:.75; }  /* 단지명을 못 찾아 시·군·구 위치에 표시한 기사 */
.kpop { position:relative; background:#fff; border-radius:12px; padding:12px 30px 12px 14px; width:250px;
  box-shadow:0 6px 20px rgba(0,0,0,.2); font-family:inherit; white-space:normal; }
.kpop:after { content:''; position:absolute; left:50%; bottom:-8px; margin-left:-8px;
  border:8px solid transparent; border-bottom:0; border-top-color:#fff; }
.kpop-x { position:absolute; top:6px; right:8px; border:none; background:none; font-size:18px; color:#99a; cursor:pointer; }
.pop-cat { font-size:11px; font-weight:700; margin-bottom:4px; }
.pop-ttl { font-size:13px; font-weight:700; color:#1a2a3a; line-height:1.45; margin-bottom:6px; }
.pop-btn { font-size:12px; color:#0d6efd; background:none; border:none; padding:0; font-weight:700; cursor:pointer; font-family:inherit; }

/* 넓은 화면(PC)에서는 목록과 지도를 나란히 */
@media (min-width: 900px) {
  main { display:grid; grid-template-columns:minmax(380px,1fr) 1.2fr; }
  .pane { position:relative; inset:auto; }
  #mapPane, body.show-map #listPane { visibility:visible; }
  .tabs { display:none; }
}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-row">
    <h1 id="ttl">🏗️ 부동산 뉴스</h1>
    <nav class="rsw"><a href="#gyeonggi" id="rsw-gyeonggi">경기·인천</a><a href="#seoul" id="rsw-seoul">서울</a></nav>
  </div>
  <div class="meta" id="meta">불러오는 중…</div>
</header>

<nav class="filters" id="filters"></nav>

<main>
  <section class="pane" id="listPane"><div class="empty"><div class="ico">⏳</div>뉴스를 불러오는 중입니다</div></section>
  <section class="pane" id="mapPane">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
  </section>
</main>

<div class="tabs">
  <button id="tabList" class="on" onclick="showMap(false)">📰 목록</button>
  <button id="tabMap" onclick="showMap(true)">🗺️ 지도</button>
</div>

<script>
// 카카오 개발자 콘솔의 JavaScript 키 (등록한 도메인에서만 작동하므로 공개돼도 다른 곳에서 쓸 수 없음)
const KAKAO_JS_KEY = '997b87d7a5a35bc160624fba963badb2';

const CATS = {
  '토지/개발':'#27ae60', '도로확장':'#e67e22', '재건축/재개발':'#e74c3c',
  '상권개발':'#8e44ad', '시장동향':'#0d8ab5'
};
const REGION = {
  gyeonggi: { name:'경기·인천', file:'news.json',  center:[37.45, 127.0],  level:10 },
  seoul:    { name:'서울',      file:'seoul.json', center:[37.56, 126.99], level:8  },
};
const regionCode = () => (location.hash.slice(1) in REGION) ? location.hash.slice(1) : 'gyeonggi';
const color = c => CATS[c] || '#0d6efd';
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeUrl = u => /^https:\/\/(www\.)?(joongboo|hankyung|sedaily)\.com\//.test(u || '') ? u : '';
const pinLabel = n => n.pin === 'place' && n.pin_name ? n.pin_name : n.region;

let news = [], filter = '전체', markers = {}, map = null, popup = null, mapReady = false;

// ── 카카오 지도 ───────────────────────────────────
function loadKakao() {
  return new Promise((resolve, reject) => {
    if (!KAKAO_JS_KEY) return reject(new Error('no key'));
    const s = document.createElement('script');
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
    s.onload = () => (window.kakao && kakao.maps) ? kakao.maps.load(resolve) : reject(new Error('sdk'));
    s.onerror = () => reject(new Error('load'));
    document.head.appendChild(s);
  });
}

async function initMap() {
  document.getElementById('legend').innerHTML =
    Object.entries(CATS).map(([k,v]) => `<div><i style="background:${v}"></i>${k}</div>`).join('');
  try {
    await loadKakao();
    const R = REGION[regionCode()];
    map = new kakao.maps.Map(document.getElementById('map'), {
      center: new kakao.maps.LatLng(...R.center), level: R.level });
    map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPLEFT);
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    kakao.maps.event.addListener(map, 'click', closePopup);
    mapReady = true;
    drawMarkers();
  } catch (e) {
    document.getElementById('map').innerHTML =
      `<div class="empty"><div class="ico">🗺️</div>지도를 불러오지 못했습니다.<br>카카오 지도 키와 등록된 사이트 주소를 확인해 주세요.</div>`;
  }
}

function closePopup() { if (popup) { popup.setMap(null); popup = null; } }

function openPopup(n, pos) {
  closePopup();
  const el = document.createElement('div');
  el.className = 'kpop';
  el.innerHTML = `<button class="kpop-x" aria-label="닫기">×</button>
    <div class="pop-cat" style="color:${color(n.category)}">${esc(n.category)} · ${esc(pinLabel(n))}</div>
    <div class="pop-ttl">${esc(n.title)}</div>
    <button class="pop-btn">요약 보기 ›</button>`;
  el.querySelector('.kpop-x').onclick = closePopup;
  el.querySelector('.pop-btn').onclick = () => goCard(n.id);
  ['mousedown','touchstart','click'].forEach(ev => el.addEventListener(ev, e => e.stopPropagation()));
  popup = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 1.18, zIndex: 10 });
  popup.setMap(map);
}

function drawMarkers() {
  if (!mapReady) return;
  closePopup();
  Object.values(markers).forEach(m => m.overlay.setMap(null));
  markers = {};
  const data = filter === '전체' ? news : news.filter(n => n.category === filter);
  const bounds = new kakao.maps.LatLngBounds(), used = {};
  data.forEach(n => {
    if (!n.latlng) return;
    // 같은 위치 기사가 겹치지 않도록 살짝 흩뜨림
    const k = n.latlng.join(','), same = used[k] = (used[k] || 0) + 1;
    const pos = new kakao.maps.LatLng(n.latlng[0] + (same - 1) * 0.0007, n.latlng[1] + (same - 1) * 0.0009);
    const el = document.createElement('div');
    el.className = 'kdot' + (n.pin === 'place' ? '' : ' area');
    el.style.background = color(n.category);
    el.title = pinLabel(n);
    el.onclick = e => { e.stopPropagation(); openPopup(n, pos); select(n.id); };
    const overlay = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 0.5, zIndex: 3 });
    overlay.setMap(map);
    markers[n.id] = { overlay, pos, n };
    bounds.extend(pos);
  });
  fitAll(bounds, Object.keys(markers).length);
}

function fitAll(bounds, count) {
  const R = REGION[regionCode()];
  if (!count) { map.setCenter(new kakao.maps.LatLng(...R.center)); map.setLevel(R.level); return; }
  map.setBounds(bounds || allBounds(), 50, 40, 90, 40);
  if (map.getLevel() < 5) map.setLevel(5);
}
function allBounds() {
  const b = new kakao.maps.LatLngBounds();
  Object.values(markers).forEach(m => b.extend(m.pos));
  return b;
}

function showMap(on) {
  document.body.classList.toggle('show-map', on);
  document.getElementById('tabMap').classList.toggle('on', on);
  document.getElementById('tabList').classList.toggle('on', !on);
  if (on && mapReady) setTimeout(() => map.relayout(), 50);
}

// 카드의 위치 버튼 → 지도로 이동
function goMap(id) {
  const m = markers[id]; if (!m) return;
  showMap(true);
  select(id);
  setTimeout(() => {
    map.relayout();
    map.setLevel(m.n.pin === 'place' ? 4 : 7);
    map.setCenter(m.pos);
    openPopup(m.n, m.pos);
  }, 80);
}
// 지도 팝업의 "요약 보기" → 목록의 해당 카드로
function goCard(id) {
  showMap(false);
  select(id);
  const el = document.getElementById('c' + id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}
function select(id) {
  document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel'));
  const el = document.getElementById('c' + id); if (el) el.classList.add('sel');
}

// ── 화면 그리기 ───────────────────────────────────
function renderFilters() {
  const counts = { '전체': news.length };
  news.forEach(n => counts[n.category] = (counts[n.category] || 0) + 1);
  document.getElementById('filters').innerHTML = ['전체', ...Object.keys(CATS)].map(c =>
    `<button class="tag ${c===filter?'on':''}" style="--c:${c==='전체'?'#0d6efd':color(c)}"
      onclick="setFilter('${c}')">${c}<span class="n">${counts[c]||0}</span></button>`).join('');
}
function setFilter(c) { filter = c; renderFilters(); render(); }

function render() {
  const data = filter === '전체' ? news : news.filter(n => n.category === filter);
  const list = document.getElementById('listPane');
  if (!data.length) {
    list.innerHTML = `<div class="empty"><div class="ico">🔍</div>최근 7일 동안 이 분류의 기사가 없습니다</div>`;
  } else {
    let lastDay = '';
    list.innerHTML = data.map(n => {
      const day = (n.time || '').slice(0, 10);
      const head = day !== lastDay ? `<div class="day">${esc(dayLabel(day))}</div>` : '';
      lastDay = day;
      const lines = (n.summary || '').split('\n').map(s => s.trim()).filter(Boolean).slice(0, 3);
      const url = safeUrl(n.url);
      const label = pinLabel(n);
      const rgn = label
        ? (n.latlng ? `<button class="rgn" onclick="goMap(${n.id})">📍 ${esc(label)}</button>`
                    : `<span class="rgn nomap">📍 ${esc(label)}</span>`) : '';
      return `${head}<article class="card" id="c${n.id}">
        <div class="top"><span class="cat" style="background:${color(n.category)}">${esc(n.category)}</span>
          ${rgn}<span class="tm">${esc((n.time || '').slice(11, 16))}</span></div>
        <div class="ttl">${esc(n.title)}</div>
        <div class="sum">${lines.map((l, i) => `<div><b>${i+1}</b><span>${esc(l.replace(/^\d+[.)]\s*/, ''))}</span></div>`).join('')}</div>
        ${url ? `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener">원문 보기 ›</a>` : ''}
        ${n.source ? `<span class="src"> · ${esc(n.source)}</span>` : ''}
      </article>`;
    }).join('');
  }
  drawMarkers();
}

function dayLabel(d) {
  if (!d) return '';
  const days = ['일','월','화','수','목','금','토'];
  const dt = new Date(d + 'T00:00:00+09:00');
  const today = new Date(new Date().toLocaleString('en-US', { timeZone:'Asia/Seoul' })).toISOString().slice(0, 10);
  const label = `${dt.getMonth()+1}월 ${dt.getDate()}일 (${days[dt.getDay()]})`;
  return d === today ? '오늘 · ' + label : label;
}

// ── 데이터 불러오기 ───────────────────────────────
async function load() {
  const code = regionCode(), R = REGION[code];
  document.title = `${R.name} 부동산 뉴스`;
  document.getElementById('ttl').textContent = `🏗️ ${R.name} 부동산 뉴스`;
  Object.keys(REGION).forEach(k => document.getElementById('rsw-' + k).classList.toggle('on', k === code));
  document.getElementById('meta').textContent = '불러오는 중…';
  filter = '전체';
  try {
    const r = await fetch(R.file + '?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (code !== regionCode()) return;  // 불러오는 사이 지역을 바꾼 경우
    news = (d.items || []).map((n, i) => ({ ...n, id:i }));
    document.getElementById('meta').textContent =
      `${d.source || ''} · 최근 7일 ${news.length}건 · 업데이트 ${d.updated || '-'}`;
  } catch (e) {
    news = [];
    document.getElementById('meta').textContent = '불러오기 실패';
  }
  renderFilters();
  render();
  if (!news.length && document.getElementById('meta').textContent === '불러오기 실패') {
    document.getElementById('listPane').innerHTML =
      `<div class="empty"><div class="ico">⚠️</div>뉴스 데이터를 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</div>`;
  }
  document.getElementById('listPane').scrollTop = 0;
}
initMap();
load();
window.addEventListener('hashchange', load);
</script>
</body>
</html>
